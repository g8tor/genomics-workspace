[project]
name = "i5k-django"
version = "0.1.0"
description = "Transforming Djang based data to FastAPI + SqlAlchemy Data"
authors = [
    {name = "Vernon Chapman",email = "g8tor692@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb (>=1.4.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
