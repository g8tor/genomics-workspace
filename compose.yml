  django-db:
    image: "docker.io/library/postgres:17-alpine3.22"
    container_name: "django-db"
    hostname: "django-db"
    environment:
      POSTGRES_USER: "${APP_USER}"
      POSTGRES_PASSWORD: "${APP_USER}"
      POSTGRES_HOST_AUTH_METHOD: md5
      DB_NAME: "${DB_NAME}"
      DATABASE_URL: postgresql+psycopg2://${APP_USER}:${APP_USER}@localhost:5432/django
    profiles:
      - db
      - django
    volumes:
      - /Users/vernon.chapman/git/ree/nal-i5k-drupal-migration/web/api:/export/
      - ./scripts/sql:/sql
      - ./data/fastafiles.md5:/fastafiles.md5
      - ./data/django.pgc:/django.pgc
      - ./data/django_training.pgc:/django_training.pgc
      - ./docker-files/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./docker-files/init-env.sh:/sql/init-env.sh
      
      

