services:

  django_db:
    #############################################################
    # This database container serves as the datastore for
    # both the api and workspace services defined below.
    # Ideally this is a managed service in Azure  VDC: 09/21/2024
    ##############################################################
    image: "docker.io/library/postgres:16-alpine"
    container_name: "django_db"
    hostname: "django_db"
    environment:
      POSTGRES_USER: "${APP_USER}"
      POSTGRES_PASSWORD: "${APP_USER}"
      POSTGRES_HOST_AUTH_METHOD: md5
      DB_NAME: "${DB_NAME}"
    profiles:
      - db
      - local
    volumes:
    ################################################################
    # Uncomment the line below replacing {PATH_TO_DUMP} with the 
    # fulll or relative path to a postgresql dump file.
    ################################################################
    #  - {PATH_TO_DUMP}:/docker-entrypoint-initdb.d/django.pgc
    #  - ./django.pgc:/docker-entrypoint-initdb.d/django.pgc
      - ./docker-files/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./data/django.pgc:/django.pgc
      - ./data/django_training.pgc:/django_training.pgc

    ports:
      - 5434:5432

  redis:
    #############################################################
    # i5K (tasks) key/value store for session data 
    # Ideally this is a managed service in Azure VDC: 08/21/2024
    ##############################################################
    image: redis/redis-stack:latest
    container_name: redis
    hostname: redis
    profiles:
      #- local
      - managed

  django:
    #############################################################
    # i5K api backend tasks service
    # VDC: 08/21/2024
    ##############################################################
    image: "localhost/i5k-django"
    hostname: "django"
    container_name: "django"
    tty: true
    build:
      args:
        UID: "${UID}"
        GID: "${GID}"
    environment:
      PYTHONPATH: "/app/i5k/src:/app/i5k/exporter"
      SSL_MODE: ${SSL_MODE}
      DB_PASS:  ${DB_PASS}
      DB_USER:  ${DB_USER}
      DB_HOST:  ${DB_HOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    profiles:
      - local
      - managed
      - solo
    ports:
      - 8001:8000
    volumes: 
      - ./src:/app/i5k/src
      - ./exporter:/app/i5k/exporter
      - ./data:/app/i5k/data

      ##############################################################
      # Bind Mounts
      ##############################################################
      #- ./docker-files/supervisord.conf:/opt/i5k/supervisord.conf
      #- ./docker-files/entry-point.sh:/opt/i5k/.venv/bin/entry-point.sh
      #- ./pyproject.toml:/opt/i5k/pyproject.toml
      #- ./poetry.lock:/opt/i5k/poetry.lock
      #- ./docker-files/entry-point.sh:/opt/i5k/.venv/bin/entry-point.sh
      #- ./docker-files/supervisord.conf:/opt/i5k/supervisord.conf
      #- ./src/i5k/settings.py:/opt/i5k/src/i5k/settings.py
      #- ./docker-files/nginx.conf:/etc/nginx/nginx.conf
      #- ./docker-files/default:/etc/nginx/sites-enabled/default

volumes:
  bin:
    external: true
    name: i5k-dev_bin
  dbs:
    external: true
    name: i5k-dev_dbs
  tasks:

networks:
  default:
    name: api
