; supervisor config file

[unix_http_server]
file=run/supervisor.sock   ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)


[supervisord]
nodaemon = true
logfile=logs/supervisord.log ; (main log file;default $CWD/supervisord.log)
pidfile=run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
childlogdir=logs/            ; ('AUTO' child log dir, default $TEMP)

; the below section must remain in the config file for RPC
; (supervisorctl/web interface) to work, additional interfaces may be
; added by defining them in separate rpcinterface: sections
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://APP_HOME/run/supervisor.sock ; use a unix:// URL  for a unix socket



[program:celery]
autostart = true
directory = APP_HOME/src
command = APP_HOME/.venv/bin/celery multi start i5k1 i5k2 -c 5  -A i5k -Q i5k -l INFO --pidfile=../run/%%n.pid --logfile=../logs/%%n.log
priority = 1

[program:production]
autostart = true
directory=APP_HOME/production
command = APP_HOME/.venv/bin/startapp.sh django
priority = 2

[program:training]
autostart = true
directory=APP_HOME/training
command = APP_HOME/.venv/bin/startapp.sh django_training
priority = 3

[program:nginx]
autostart = true
command = nginx -g 'daemon off;'
priority = 4