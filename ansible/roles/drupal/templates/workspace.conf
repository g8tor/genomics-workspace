# This is a default site configuration which will simply return 404, preventing
# chance access to any other virtualhost.
upstream php-fpm {
	server unix://{{BASEDIR}}/run/www.sock;
}

server {
  listen 80 default_server;
	#listen 443 ssl default_server;

  #ssl_certificate /etc/nginx/certs/server.crt;
  #ssl_certificate_key /etc/nginx/certs/server.key;
  #ssl_ocsp off;

  server_name localhost;
  error_log {{BASEDIR}}/weblogs/web_error.log;
  access_log {{BASEDIR}}/weblogs/web_access.log;
  root {{BASEDIR}}/wwwroot;

  location /downloads/ {
    proxy_pass http://localhost:8000/downloads/;
  }

  # Ignore favicon issues
  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  # Block some access, allow other.
  location ~ \..*/.*\.php$ {
    return 403;
  }

  location ~ ^/sites/.*/private/ {
    return 403;
  }

  location ~* ^/.well-known/ {
    allow all;
  }

  # Main config

  location / {
    try_files $uri /index.php?$query_string;
  }

  location @rewrite {
    rewrite ^ /index.php;
  }

  # Block vendor directory
  location ~ /vendor/.*\.php$ {
    deny all;
    return 404;
  }

  # From https://www.nginx.com/resources/wiki/start/topics/recipes/drupal/
  location ~ '\.php$|^/update.php' {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    # Ensure the php file exists. Mitigates CVE-2019-11043
    try_files $fastcgi_script_name =404;
    # Security note: If you're running a version of PHP older than the
    # latest 5.3, you should have "cgi.fix_pathinfo = 0;" in php.ini.
    # See http://serverfault.com/q/627903/94922 for details.
    include fastcgi_params;
    # Block httpoxy attacks. See https://httpoxy.org/.
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    fastcgi_pass php-fpm;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri @rewrite;
    expires max;
    log_not_found off;
  }

  # For styles.
  location ~ ^/sites/.*/files/styles/ {
    try_files $uri @rewrite;
  }

  # For private files being handled through Drupal.
  location ~ ^(/[a-z\-]+)?/system/files/ { 
    try_files $uri /index.php?$query_string;
  }

  # Enforce clean URLs.
  if ($request_uri ~* "^(.*/)index\.php/(.*)") {
        return 307 $1$2;
    }

}
